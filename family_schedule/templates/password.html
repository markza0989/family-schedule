<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Change password</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="topbar">
    <h1>Change password — {{ current_user }}</h1>
    <div class="right">
      <a class="btn secondary" href="{{ url_for('board') }}">Back to board</a>
    </div>
  </div>

  <div class="wrap">
    <form class="login-card" method="post" action="{{ url_for('password') }}" style="margin-top:0">
      {% if success %}
        <div class="error" style="background:#eaf5ec;border-color:#bcdcc3;color:#1e5128">
          Password updated.
        </div>
      {% endif %}
      {% if error %}<div class="error">{{ error }}</div>{% endif %}
      <div class="field">
        <label for="current">Current password</label>
        <input type="password" id="current" name="current" required autocomplete="current-password">
      </div>
      <div class="field">
        <label for="new">New password (at least 6 characters)</label>
        <input type="password" id="new" name="new" required minlength="6" autocomplete="new-password">
      </div>
      <div class="field">
        <label for="confirm">Confirm new password</label>
        <input type="password" id="confirm" name="confirm" required minlength="6" autocomplete="new-password">
      </div>
      <button class="btn" type="submit">Update password</button>
    </form>
  </div>
</body>
</html>
